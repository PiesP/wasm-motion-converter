<!doctype html>
<html lang="en">
  <!-- dropconvert-wasm: in-browser video to GIF/WebP -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="color-scheme" content="light dark" />

    <title>Motion Converter - Video to GIF/WebP</title>
    <meta
      name="description"
      content="Convert videos to animated GIF or WebP images in your browser. No uploads, all processing happens locally."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Motion Converter - Video to GIF/WebP" />
    <meta property="og:description" content="Convert videos to animated GIF or WebP images in your browser. No uploads, all processing happens locally." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wasm-motion-converter.pages.dev/" />
    <meta property="og:image" content="https://wasm-motion-converter.pages.dev/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Motion Converter - Video to GIF/WebP" />
    <meta name="twitter:description" content="Convert videos to animated GIF or WebP images in your browser." />
    <meta name="twitter:image" content="https://wasm-motion-converter.pages.dev/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://wasm-motion-converter.pages.dev/" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- Disable Cloudflare automatic script injection -->
    <script data-cfasync="false">/* disable cf beacon */</script>

    <!-- Preconnect to CDN origins -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://esm.sh" crossorigin />

    <meta name="color-scheme" content="light dark" />

  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
