# Upgrade only affected qs requirements within the patched 6.x line.
overrides:
  qs@>=6.11.1 <6.15.2: "^6.16.0"
  # Miniflare pins a sharp release affected by GHSA-rgj7-g3m4-5g8c.
  sharp@>=0.35.0 <0.35.4: "^0.35.4"

allowBuilds:
  esbuild: true
  workerd: false

# Fail closed on unreviewed dependency scripts and exotic transitive sources.
strictDepBuilds: true
blockExoticSubdeps: true

engineStrict: true

# Keep paired tooling and plugin peer requirements compatible during installs.
strictPeerDependencies: true

# Prefer current releases while retaining a short supply-chain observation window.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600

# Stryker 10 cannot select Vitest 5 test names (upstream stryker-js#6214).
# Revisit after a published runner fix and a real mutation run; keep majors
# visible in Dependabot for review.
update:
  ignoreDeps:
    - vitest
    - "@vitest/coverage-v8"
