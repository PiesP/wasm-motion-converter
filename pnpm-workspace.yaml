overrides:
  # Miniflare pins sharp releases affected by GHSA-rgj7-g3m4-5g8c and GHSA-wq5f-xc86-pv6w.
  sharp@>=0.35.0 <0.35.5: "0.35.5"
  # Miniflare pins an Undici version with HTTP and TLS security advisories.
  undici@>=7.0.0 <7.29.1: "7.29.1"
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true
  workerd: false

# Fail closed on unreviewed dependency scripts and exotic transitive sources.
strictDepBuilds: true
blockExoticSubdeps: true

engineStrict: true

# Keep paired tooling and plugin peer requirements compatible during installs.
strictPeerDependencies: true

# Prefer current releases while retaining a short supply-chain observation window.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600

patchedDependencies:
  mediabunny@1.61.4: patches/mediabunny@1.61.4.patch
  wasm-webp@0.1.0: patches/wasm-webp@0.1.0.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.4
  vite-plus: 1.2.0
  "@vitest/coverage-v8": 5.0.4
