minimumReleaseAge: 10080

# Security-critical packages that should bypass the minimum release age.
# These packages receive immediate updates even within the 7-day cooling period:
#   - esbuild/minimatch/rollup/seroval: build toolchain + serialization, known targets
#   - ffmpeg.wasm: WebAssembly binaries shipped from CDN, security-sensitive
#   - comlink: workers serialization bridge
minimumReleaseAgeExclude:
  - esbuild
  - "@esbuild/*"
  - minimatch
  - rollup
  - seroval
  - "@ffmpeg/*"
  - comlink

allowBuilds:
  esbuild: true
  core-js: true

strictDepBuilds: true

blockExoticSubdeps: true
engineStrict: true
lockfileVersion: 3
