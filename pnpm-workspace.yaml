overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true

# Fail closed on unreviewed dependency scripts and exotic transitive sources.
strictDepBuilds: true
blockExoticSubdeps: true

engineStrict: true

# Keep paired tooling and plugin peer requirements compatible during installs.
strictPeerDependencies: true

# The exact managed alias bundles Vite 8.3.5, within these callers' peer ranges.
# Recheck callers, alias and bundled Vite together on each toolchain update.
peerDependencyRules:
  allowedVersions:
    "@tailwindcss/vite@4.3.3>vite": 1.4.0
    "@vitest/mocker@5.0.5>vite": 1.4.0
    "vitest@5.0.5>vite": 1.4.0
    "vite-plugin-solid@2.11.14>vite": 1.4.0
    "vitefu@1.1.3>vite": 1.4.0

# Prefer current releases while retaining a short supply-chain observation window.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600

patchedDependencies:
  mediabunny@1.62.0: patches/mediabunny@1.62.0.patch
  wasm-webp@0.1.0: patches/wasm-webp@0.1.0.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
