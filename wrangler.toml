# Cloudflare Pages Build Configuration
# https://developers.cloudflare.com/pages/configuration/build-configuration/

name = "dropconvert"
compatibility_date = "2026-06-15"
pages_build_output_dir = "dist"

# Pages reads these variables before its automatic dependency-install step.
[vars]
NODE_ENV = "production"
SKIP_DEPENDENCY_INSTALL = "1"
# Pages moves the source clone into this build root before installing tools.
NODE_BUILD_DEFINITIONS = "/opt/buildhome/repo/scripts/build/node-build-definitions"
# Temporary incident qualification; remove after retaining the provider receipt.
PAGES_NODE_QUALIFICATION = "1"
