name: 🔒 Security Scanning

# Responsibility: Security analysis for Node.js + pnpm project
# - Default branch/PR/merge queue: CodeQL for Actions and JavaScript/TypeScript
#   plus Semgrep secrets coverage
# - PR gate: OSV diff scan; merge queue: full OSV scan
# - Scheduled/manual diagnostics: pinned-tool freshness, full OSV scan, and full Semgrep SARIF
#
# Trigger: Push/PR to master + merge queue + weekly schedule + manual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 1 * * 0" # Weekly at 1 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-metadata:
    name: Resolve reviewed scanner images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      OSV_SCANNER_IMAGE: ${{ steps.pins.outputs.OSV_SCANNER_IMAGE }}
      SEMGREP_IMAGE: ${{ steps.pins.outputs.SEMGREP_IMAGE }}
    steps:
      - name: 📥 Checkout reviewed pin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7a5ab41114bfe234b4524303680f792266b551d3
          persist-credentials: false
          submodules: false

      - name: 📦 Setup reviewed pin runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔐 Export validated scanner images
        id: pins
        run: |
          set -euo pipefail
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          for name in pinned-tools.json pinned-tools.ts check-pinned-tools.ts install-nose.ts; do
            install -m 0600 "scripts/ci/$name" "$pinned_dir/$name"
          done
          GITHUB_ENV="$GITHUB_OUTPUT" node --experimental-strip-types "$pinned_dir/pinned-tools.ts" env

  changes:
    name: Classify security changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dependency: ${{ steps.route.outcome == 'success' && steps.route.outputs.dependency || 'true' }}
      codeql: ${{ steps.route.outcome == 'success' && steps.route.outputs.codeql || 'true' }}
      semgrep: ${{ steps.route.outcome == 'success' && steps.route.outputs.semgrep || 'true' }}
      semgrep_full: ${{ steps.route.outcome == 'success' && steps.route.outputs.semgrep_full || 'true' }}
      security_tools: ${{ steps.route.outcome == 'success' && steps.route.outputs.security_tools || 'true' }}
    steps:
      - name: 📥 Checkout routing inputs
        id: routing_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 📦 Setup routing Node without dependencies
        id: routing_runtime
        if: ${{ steps.routing_checkout.outcome == 'success' }}
        continue-on-error: true
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🧭 Classify changed paths
        id: classify
        if: ${{ steps.routing_checkout.outcome == 'success' && steps.routing_runtime.outcome == 'success' }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-workflow-changes.ts
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-workflow-changes.ts"
              [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              # A trusted base without this file fails routing and enables every gate.
              git show "$TRUSTED_BASE_SHA:scripts/ci/classify-workflow-changes.ts" > "$classifier"
              ;;
          esac
          node --experimental-strip-types "$classifier"

      - name: 🛡️ Resolve fail-open routing
        id: route
        if: ${{ always() }}
        continue-on-error: true
        env:
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          DEPENDENCY: ${{ steps.classify.outputs.dependency }}
          CODEQL: ${{ steps.classify.outputs.codeql }}
          SEMGREP: ${{ steps.classify.outputs.semgrep }}
          SEMGREP_FULL: ${{ steps.classify.outputs.semgrep_full }}
          SECURITY_TOOLS: ${{ steps.classify.outputs.security_tools }}
        run: |
          set -euo pipefail
          valid=true
          for value in "$DEPENDENCY" "$CODEQL" "$SEMGREP" "$SEMGREP_FULL" "$SECURITY_TOOLS"; do
            if [[ ! "$value" =~ ^(true|false)$ ]]; then
              valid=false
            fi
          done

          if [[ "$CLASSIFY_OUTCOME" != "success" || "$valid" != "true" ]]; then
            echo "Change routing failed; enabling every security gate."
            DEPENDENCY=true
            CODEQL=true
            SEMGREP=true
            SEMGREP_FULL=true
            SECURITY_TOOLS=true
          fi

          {
            echo "dependency=$DEPENDENCY"
            echo "codeql=$CODEQL"
            echo "semgrep=$SEMGREP"
            echo "semgrep_full=$SEMGREP_FULL"
            echo "security_tools=$SECURITY_TOOLS"
          } >> "$GITHUB_OUTPUT"

  pinned-tools:
    name: 🔄 Pinned tool freshness
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.security_tools == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7a5ab41114bfe234b4524303680f792266b551d3
          persist-credentials: false
          submodules: false

      - name: 📦 Setup reviewed pin runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔎 Check pinned tools after the cooling window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          for name in pinned-tools.json pinned-tools.ts check-pinned-tools.ts install-nose.ts; do
            install -m 0600 "scripts/ci/$name" "$pinned_dir/$name"
          done
          node --experimental-strip-types "$pinned_dir/check-pinned-tools.ts"

  osv-scan-pr:
    name: pr-gate/osv / osv-scan
    needs: [changes, pin-metadata]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      OSV_SCANNER_IMAGE: ${{ needs['pin-metadata'].outputs.OSV_SCANNER_IMAGE }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.outputs.dependency != 'true' }}
        run: echo "OSV dependency scanning is not affected by this change set."

      - name: 📥 Checkout PR result and history
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: ⏪ Checkout the trusted PR base
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git switch --force --detach "$BASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          git submodule update --init --recursive

      - name: 📦 Setup trusted OSV runtime
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔒 Prepare pinned OSV helper
        id: osv-helper
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: PiesP/browser-core/automation/actions/prepare-osv@9a9471ad301e439bcd1ebc52334cf6b4399510e7

      - name: 📁 Prepare private OSV result directory
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: 🛡️ Scan dependencies before the PR
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-old consumer

      - name: ⏩ Checkout the PR result
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Scan dependencies after the PR
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-new consumer

      - name: 📋 Report newly introduced vulnerabilities
        id: osv-report
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" report-pr consumer

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.outputs.dependency == 'true') }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-dispatch:
    name: pr-gate/osv / osv-scan
    needs: [changes, pin-metadata]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OSV_SCANNER_IMAGE: ${{ needs['pin-metadata'].outputs.OSV_SCANNER_IMAGE }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.outputs.dependency != 'true' }}
        run: echo "OSV dependency scanning is not affected by this change set."

      - name: 📥 Checkout target and history
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: 🔒 Select trusted OSV runtime manifest
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          POLICY_SHA: ${{ github.event.merge_group.base_sha || github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if ! git cat-file -e "$POLICY_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
            fi
            git cat-file -e "$POLICY_SHA^{commit}"
            git cat-file -e "$EXPECTED_HEAD_SHA^{commit}"
            git merge-base --is-ancestor "$POLICY_SHA" "$EXPECTED_HEAD_SHA"
            git switch --force --detach "$POLICY_SHA"
          else
            [[ "$POLICY_SHA" == "$GITHUB_SHA" ]]
          fi

      - name: 📦 Setup trusted OSV runtime
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔒 Prepare pinned OSV helper
        id: osv-helper
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: PiesP/browser-core/automation/actions/prepare-osv@9a9471ad301e439bcd1ebc52334cf6b4399510e7

      - name: 📁 Prepare private OSV result directory
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: ⏩ Restore target for the full scan
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Run OSV scan
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-full consumer

      - name: 📋 Convert OSV results to SARIF and enforce the vulnerability gate
        id: osv-report
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" report-full consumer

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.outputs.dependency == 'true') }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: 🔎 CodeQL Analysis (${{ matrix.language }})
    needs: changes
    if: ${{ needs.changes.outputs.codeql == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 🔎 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: pr-gate/semgrep
    needs: [changes, pin-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    permissions:
      contents: read
      security-events: write
    container:
      image: ${{ needs['pin-metadata'].outputs.SEMGREP_IMAGE || 'invalid@@' }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: ⏭️ No Semgrep-relevant changes
        if: ${{ needs.changes.outputs.semgrep != 'true' }}
        run: echo "Semgrep is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.semgrep == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔍 Run full Semgrep scan (weekly/manual)
        if: >-
          ${{ needs.changes.outputs.semgrep_full == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: 🔐 Run Semgrep secrets scan on routine events
        if: >-
          ${{ needs.changes.outputs.semgrep == 'true' &&
          github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: 📊 Upload SARIF to GitHub Security
        if: ${{ needs.changes.outputs.semgrep == 'true' && !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs:
      [changes, pinned-tools, osv-scan-pr, osv-scan-dispatch, codeql, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize and validate event-specific scans
        env:
          EVENT_NAME: ${{ github.event_name }}
          PINNED_TOOLS_RESULT: ${{ needs.pinned-tools.result }}
          OSV_PR_RESULT: ${{ needs.osv-scan-pr.result }}
          OSV_FULL_RESULT: ${{ needs.osv-scan-dispatch.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          CODEQL_REQUIRED: ${{ needs.changes.outputs.codeql }}
          PINNED_TOOLS_REQUIRED: ${{ needs.changes.outputs.security_tools }}
        run: |
          set -euo pipefail

          {
            echo "## Security scan results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Pinned tool freshness | $PINNED_TOOLS_RESULT |"
            echo "| OSV PR diff | $OSV_PR_RESULT |"
            echo "| OSV full | $OSV_FULL_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| Semgrep | $SEMGREP_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          expect_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "Expected $label to succeed for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_when_required() {
            local required="$1"
            local label="$2"
            local result="$3"
            if [[ "$required" == "true" ]]; then
              expect_success "$label" "$result"
            elif [[ "$result" != "skipped" ]]; then
              echo "Expected irrelevant $label to skip for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_when_required "$CODEQL_REQUIRED" "CodeQL" "$CODEQL_RESULT"
          expect_success "Semgrep" "$SEMGREP_RESULT"
          case "$EVENT_NAME" in
            pull_request)
              expect_success "OSV PR diff" "$OSV_PR_RESULT"
              ;;
            merge_group)
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            push|schedule)
              expect_when_required "$PINNED_TOOLS_REQUIRED" "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            workflow_dispatch)
              expect_success "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            *)
              echo "Unsupported security workflow event: $EVENT_NAME" >&2
              failed=1
              ;;
          esac

          exit "$failed"
