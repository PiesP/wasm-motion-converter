name: 🔒 Security Scanning

# Responsibility: Security analysis for Node.js + pnpm project
# - Default branch/PR/merge queue: CodeQL for Actions and JavaScript/TypeScript
#   plus Semgrep secrets coverage
# - PR gate: OSV diff scan
# - Merge queue/manual gate: OSV full scan
# - Scheduled/manual depth: pinned-tool freshness + OSV full scan + full Semgrep SARIF
#
# Trigger: Push/PR to master + merge queue + weekly schedule + manual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 1 * * 0" # Weekly at 1 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # google/osv-scanner-action image v2.6.0 (linux/amd64), resolved 2026-09-19.
  # Pin the runtime image itself: the upstream action metadata references a
  # mutable version tag even when the action is pinned to a commit SHA.
  OSV_SCANNER_IMAGE: "ghcr.io/google/osv-scanner-action@sha256:71ad04ab2f8798be47870f9b18817ad317c2f8f2f97aa6726ba10d5578bc174a"

jobs:
  changes:
    name: Classify security changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dependency: ${{ steps.route.outcome == 'success' && steps.route.outputs.dependency || 'true' }}
      codeql: ${{ steps.route.outcome == 'success' && steps.route.outputs.codeql || 'true' }}
      semgrep: ${{ steps.route.outcome == 'success' && steps.route.outputs.semgrep || 'true' }}
      semgrep_full: ${{ steps.route.outcome == 'success' && steps.route.outputs.semgrep_full || 'true' }}
      security_tools: ${{ steps.route.outcome == 'success' && steps.route.outputs.security_tools || 'true' }}
    steps:
      - name: 📥 Checkout routing inputs
        id: routing_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 🧭 Classify changed paths
        id: classify
        if: ${{ steps.routing_checkout.outcome == 'success' }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-workflow-changes.sh
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-workflow-changes.sh"
              [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              git show "$TRUSTED_BASE_SHA:scripts/ci/classify-workflow-changes.sh" > "$classifier"
              ;;
          esac
          bash "$classifier"

      - name: 🛡️ Resolve fail-open routing
        id: route
        if: ${{ always() }}
        continue-on-error: true
        env:
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          DEPENDENCY: ${{ steps.classify.outputs.dependency }}
          CODEQL: ${{ steps.classify.outputs.codeql }}
          SEMGREP: ${{ steps.classify.outputs.semgrep }}
          SEMGREP_FULL: ${{ steps.classify.outputs.semgrep_full }}
          SECURITY_TOOLS: ${{ steps.classify.outputs.security_tools }}
        run: |
          set -euo pipefail
          valid=true
          for value in "$DEPENDENCY" "$CODEQL" "$SEMGREP" "$SEMGREP_FULL" "$SECURITY_TOOLS"; do
            if [[ ! "$value" =~ ^(true|false)$ ]]; then
              valid=false
            fi
          done

          if [[ "$CLASSIFY_OUTCOME" != "success" || "$valid" != "true" ]]; then
            echo "Change routing failed; enabling every security gate."
            DEPENDENCY=true
            CODEQL=true
            SEMGREP=true
            SEMGREP_FULL=true
            SECURITY_TOOLS=true
          fi

          {
            echo "dependency=$DEPENDENCY"
            echo "codeql=$CODEQL"
            echo "semgrep=$SEMGREP"
            echo "semgrep_full=$SEMGREP_FULL"
            echo "security_tools=$SECURITY_TOOLS"
          } >> "$GITHUB_OUTPUT"

  pinned-tools:
    name: 🔄 Pinned tool freshness
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.security_tools == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check pinned tools after the cooling window
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-pinned-tools.sh

  osv-scan-pr:
    name: pr-gate/osv / osv-scan
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.outputs.dependency != 'true' }}
        run: echo "OSV dependency scanning is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: ⏪ Checkout the PR base
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git switch --force --detach "$BASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          git submodule update --init --recursive

      - name: 📁 Materialize trusted OSV policy from PR base
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          install -m 0600 .github/codex-security/osv-scanner.toml \
            "$RUNNER_TEMP/osv-results/osv-scanner.toml"
          install -m 0600 scripts/security/scope-osv-exceptions.py "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"
          test -s "$RUNNER_TEMP/osv-results/osv-scanner.toml"

      - name: 🛡️ Scan dependencies before the PR
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          raw_reporter_log="$results_dir/old-results.raw.reporter.log"
          rm -f "$results_dir/old-results.raw.json" "$results_dir/old-results.json" "$raw_reporter_log"
          scan_status=0
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --config=/results/osv-empty.toml \
            --format=json \
            --output-file=/results/old-results.raw.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            . || scan_status=$?
          if ((scan_status > 1)); then
            exit "$scan_status"
          fi
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --new=old-results.raw.json \
            --output-files=json:/dev/null \
            --fail-on-vuln=false 2>&1 | tee "$raw_reporter_log"
          raw_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          raw_report_status="${raw_pipeline_status[0]}"
          if ((raw_pipeline_status[1] != 0)); then
            exit "${raw_pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$raw_reporter_log"; then
            echo "OSV reporter rejected the raw scanner output." >&2
            exit 2
          fi
          if ((raw_report_status != 0)); then
            exit "$raw_report_status"
          fi
          python3 "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py" \
            --policy "$RUNNER_TEMP/osv-results/osv-scanner.toml" \
            --input "$RUNNER_TEMP/osv-results/old-results.raw.json" \
            --output "$RUNNER_TEMP/osv-results/old-results.json"

      - name: ⏩ Checkout the PR result
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Scan dependencies after the PR
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          raw_reporter_log="$results_dir/new-results.raw.reporter.log"
          rm -f "$results_dir/new-results.raw.json" "$results_dir/new-results.json" "$raw_reporter_log"
          scan_status=0
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --config=/results/osv-empty.toml \
            --format=json \
            --output-file=/results/new-results.raw.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            . || scan_status=$?
          if ((scan_status > 1)); then
            exit "$scan_status"
          fi
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --new=new-results.raw.json \
            --output-files=json:/dev/null \
            --fail-on-vuln=false 2>&1 | tee "$raw_reporter_log"
          raw_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          raw_report_status="${raw_pipeline_status[0]}"
          if ((raw_pipeline_status[1] != 0)); then
            exit "${raw_pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$raw_reporter_log"; then
            echo "OSV reporter rejected the raw scanner output." >&2
            exit 2
          fi
          if ((raw_report_status != 0)); then
            exit "$raw_report_status"
          fi
          python3 "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py" \
            --policy "$RUNNER_TEMP/osv-results/osv-scanner.toml" \
            --input "$RUNNER_TEMP/osv-results/new-results.raw.json" \
            --output "$RUNNER_TEMP/osv-results/new-results.json"

      - name: 📋 Report newly introduced vulnerabilities
        id: osv-report
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          reporter_log="$results_dir/osv-reporter.log"
          rm -f "$results_dir/osv-results.sarif" "$reporter_log"
          python3 -I - "$results_dir" old-results.json new-results.json <<'PY'
          from pathlib import Path
          import runpy
          import sys

          results_dir = Path(sys.argv[1])
          validator = runpy.run_path(
              str(results_dir / "scope-osv-exceptions.py"),
              run_name="scope_osv_validator",
          )
          for name in sys.argv[2:]:
              report = validator["load_report"](results_dir / name)
              validator["validate_and_filter_report"](report, frozenset())
          PY
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --old=old-results.json \
            --new=new-results.json \
            --output-files=sarif:osv-results.sarif \
            '--output-files=gh-annotations:#stderr' \
            --fail-on-vuln=true 2>&1 | tee "$reporter_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          report_status="${pipeline_status[0]}"
          if ((pipeline_status[1] != 0)); then
            exit "${pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$reporter_log"; then
            echo "OSV reporter rejected an input document." >&2
            exit 2
          fi
          if ((report_status > 1)); then
            exit "$report_status"
          fi
          SARIF_PATH="$results_dir/osv-results.sarif" REPORT_STATUS="$report_status" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              document = {}
              for key, value in pairs:
                  if key in document:
                      raise ValueError(f"SARIF contains duplicate key: {key}")
                  document[key] = value
              return document

          sarif_path = Path(os.environ["SARIF_PATH"])
          with sarif_path.open("r", encoding="utf-8") as sarif_file:
              sarif = json.load(sarif_file, object_pairs_hook=reject_duplicate_keys)
          if not isinstance(sarif, dict) or sarif.get("version") != "2.1.0":
              raise ValueError("reporter output is not SARIF 2.1.0")
          runs = sarif.get("runs")
          if not isinstance(runs, list) or len(runs) != 1:
              raise ValueError("reporter SARIF must contain exactly one run")
          run = runs[0]
          if not isinstance(run, dict):
              raise ValueError("reporter SARIF run must be an object")
          tool = run.get("tool")
          driver = tool.get("driver") if isinstance(tool, dict) else None
          if not isinstance(driver, dict) or driver.get("name") != "osv-scanner":
              raise ValueError("reporter SARIF tool identity is invalid")
          results = run.get("results")
          if not isinstance(results, list) or not all(isinstance(item, dict) for item in results):
              raise ValueError("reporter SARIF results must be an array of objects")
          report_status = int(os.environ["REPORT_STATUS"])
          if report_status == 1 and not results:
              raise ValueError("reporter failed for vulnerabilities but emitted no SARIF results")
          PY
          echo "sarif-upload=true" >> "$GITHUB_OUTPUT"
          exit "$report_status"

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ needs.changes.outputs.dependency == 'true' && !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-dispatch:
    name: pr-gate/osv / osv-scan
    needs: changes
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.outputs.dependency != 'true' }}
        run: echo "OSV dependency scanning is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: 📁 Materialize trusted OSV policy
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          case "$EVENT_NAME" in
            merge_group)
              [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "$TRUSTED_BASE_SHA^{commit}"
              git cat-file -e "$EXPECTED_HEAD_SHA^{commit}"
              [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]]
              git merge-base --is-ancestor "$TRUSTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
              git show "$TRUSTED_BASE_SHA:.github/codex-security/osv-scanner.toml" > \
                "$RUNNER_TEMP/osv-results/osv-scanner.toml"
              git show "$TRUSTED_BASE_SHA:scripts/security/scope-osv-exceptions.py" > \
                "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py"
              ;;
            push | schedule | workflow_dispatch)
              install -m 0600 .github/codex-security/osv-scanner.toml \
                "$RUNNER_TEMP/osv-results/osv-scanner.toml"
              install -m 0600 scripts/security/scope-osv-exceptions.py "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py"
              ;;
            *)
              printf 'Unsupported OSV full-scan event: %s\n' "$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"
          test -s "$RUNNER_TEMP/osv-results/osv-scanner.toml"

      - name: 🛡️ Run OSV scan
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          raw_reporter_log="$results_dir/osv-results.raw.reporter.log"
          rm -f "$results_dir/osv-results.raw.json" "$results_dir/osv-results.json" "$raw_reporter_log"
          scan_status=0
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --config=/results/osv-empty.toml \
            --format=json \
            --output-file=/results/osv-results.raw.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            . || scan_status=$?
          if ((scan_status > 1)); then
            exit "$scan_status"
          fi
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --new=osv-results.raw.json \
            --output-files=json:/dev/null \
            --fail-on-vuln=false 2>&1 | tee "$raw_reporter_log"
          raw_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          raw_report_status="${raw_pipeline_status[0]}"
          if ((raw_pipeline_status[1] != 0)); then
            exit "${raw_pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$raw_reporter_log"; then
            echo "OSV reporter rejected the raw scanner output." >&2
            exit 2
          fi
          if ((raw_report_status != 0)); then
            exit "$raw_report_status"
          fi
          python3 "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py" \
            --policy "$RUNNER_TEMP/osv-results/osv-scanner.toml" \
            --input "$RUNNER_TEMP/osv-results/osv-results.raw.json" \
            --output "$RUNNER_TEMP/osv-results/osv-results.json"

      - name: 📋 Convert OSV results to SARIF and enforce the vulnerability gate
        id: osv-report
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          reporter_log="$results_dir/osv-reporter.log"
          rm -f "$results_dir/osv-results.sarif" "$reporter_log"
          python3 -I - "$results_dir" osv-results.json <<'PY'
          from pathlib import Path
          import runpy
          import sys

          results_dir = Path(sys.argv[1])
          validator = runpy.run_path(
              str(results_dir / "scope-osv-exceptions.py"),
              run_name="scope_osv_validator",
          )
          for name in sys.argv[2:]:
              report = validator["load_report"](results_dir / name)
              validator["validate_and_filter_report"](report, frozenset())
          PY
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --output-files=sarif:osv-results.sarif \
            --new=osv-results.json \
            --fail-on-vuln=true 2>&1 | tee "$reporter_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          report_status="${pipeline_status[0]}"
          if ((pipeline_status[1] != 0)); then
            exit "${pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$reporter_log"; then
            echo "OSV reporter rejected an input document." >&2
            exit 2
          fi
          if ((report_status > 1)); then
            exit "$report_status"
          fi
          SARIF_PATH="$results_dir/osv-results.sarif" REPORT_STATUS="$report_status" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              document = {}
              for key, value in pairs:
                  if key in document:
                      raise ValueError(f"SARIF contains duplicate key: {key}")
                  document[key] = value
              return document

          sarif_path = Path(os.environ["SARIF_PATH"])
          with sarif_path.open("r", encoding="utf-8") as sarif_file:
              sarif = json.load(sarif_file, object_pairs_hook=reject_duplicate_keys)
          if not isinstance(sarif, dict) or sarif.get("version") != "2.1.0":
              raise ValueError("reporter output is not SARIF 2.1.0")
          runs = sarif.get("runs")
          if not isinstance(runs, list) or len(runs) != 1:
              raise ValueError("reporter SARIF must contain exactly one run")
          run = runs[0]
          if not isinstance(run, dict):
              raise ValueError("reporter SARIF run must be an object")
          tool = run.get("tool")
          driver = tool.get("driver") if isinstance(tool, dict) else None
          if not isinstance(driver, dict) or driver.get("name") != "osv-scanner":
              raise ValueError("reporter SARIF tool identity is invalid")
          results = run.get("results")
          if not isinstance(results, list) or not all(isinstance(item, dict) for item in results):
              raise ValueError("reporter SARIF results must be an array of objects")
          report_status = int(os.environ["REPORT_STATUS"])
          if report_status == 1 and not results:
              raise ValueError("reporter failed for vulnerabilities but emitted no SARIF results")
          PY
          echo "sarif-upload=true" >> "$GITHUB_OUTPUT"
          exit "$report_status"

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ needs.changes.outputs.dependency == 'true' && !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: 🔎 CodeQL Analysis (${{ matrix.language }})
    needs: changes
    if: ${{ needs.changes.outputs.codeql == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 🔎 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: pr-gate/semgrep
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      contents: read
      security-events: write
    # semgrep/semgrep:1.177.0 — last checked: 2026-09-14
    # Check for updates: https://github.com/semgrep/semgrep/releases
    container:
      image: semgrep/semgrep:1.177.0@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
    steps:
      - name: ⏭️ No Semgrep-relevant changes
        if: ${{ needs.changes.outputs.semgrep != 'true' }}
        run: echo "Semgrep is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.semgrep == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔍 Run full Semgrep scan (weekly/manual)
        if: >-
          ${{ needs.changes.outputs.semgrep_full == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: 🔐 Run Semgrep secrets scan on routine events
        if: >-
          ${{ needs.changes.outputs.semgrep == 'true' &&
          github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: 📊 Upload SARIF to GitHub Security
        if: ${{ needs.changes.outputs.semgrep == 'true' && !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif

  report-pr-gate-statuses:
    name: Report PR gate statuses
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [osv-scan-dispatch, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish required commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          OSV_RESULT: ${{ needs.osv-scan-dispatch.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          set -euo pipefail

          publish_status() {
            local context="$1"
            local result="$2"
            local state=success
            if [[ "$result" != "success" ]]; then
              state=failure
            fi

            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f "state=$state" \
              -f "context=$context" \
              -f "description=workflow_dispatch result: $result" \
              -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          publish_status "pr-gate/osv / osv-scan" "$OSV_RESULT"
          publish_status "pr-gate/semgrep" "$SEMGREP_RESULT"

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs:
      [changes, pinned-tools, osv-scan-pr, osv-scan-dispatch, codeql, semgrep, report-pr-gate-statuses]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize and validate event-specific scans
        env:
          EVENT_NAME: ${{ github.event_name }}
          PINNED_TOOLS_RESULT: ${{ needs.pinned-tools.result }}
          OSV_PR_RESULT: ${{ needs.osv-scan-pr.result }}
          OSV_FULL_RESULT: ${{ needs.osv-scan-dispatch.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          STATUS_REPORT_RESULT: ${{ needs.report-pr-gate-statuses.result }}
          CODEQL_REQUIRED: ${{ needs.changes.outputs.codeql }}
          PINNED_TOOLS_REQUIRED: ${{ needs.changes.outputs.security_tools }}
        run: |
          set -euo pipefail

          {
            echo "## Security scan results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Pinned tool freshness | $PINNED_TOOLS_RESULT |"
            echo "| OSV PR diff | $OSV_PR_RESULT |"
            echo "| OSV full | $OSV_FULL_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| Semgrep | $SEMGREP_RESULT |"
            echo "| Manual status report | $STATUS_REPORT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          expect_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "Expected $label to succeed for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_when_required() {
            local required="$1"
            local label="$2"
            local result="$3"
            if [[ "$required" == "true" ]]; then
              expect_success "$label" "$result"
            elif [[ "$result" != "skipped" ]]; then
              echo "Expected irrelevant $label to skip for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_when_required "$CODEQL_REQUIRED" "CodeQL" "$CODEQL_RESULT"
          expect_success "Semgrep" "$SEMGREP_RESULT"
          case "$EVENT_NAME" in
            pull_request)
              expect_success "OSV PR diff" "$OSV_PR_RESULT"
              ;;
            merge_group)
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            push|schedule)
              expect_when_required "$PINNED_TOOLS_REQUIRED" "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            workflow_dispatch)
              expect_success "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              expect_success "manual status report" "$STATUS_REPORT_RESULT"
              ;;
            *)
              echo "Unsupported security workflow event: $EVENT_NAME" >&2
              failed=1
              ;;
          esac

          exit "$failed"
