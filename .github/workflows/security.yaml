name: 🔒 Security Scanning

# Responsibility: Security analysis for Node.js + pnpm project
# - Default branch/PR/merge queue: CodeQL for Actions and JavaScript/TypeScript
# - PR gate: OSV diff scan
# - Merge queue/manual gate: OSV full scan
# - Default branch/scheduled/manual depth: pinned-tool freshness + OSV full scan + Semgrep SARIF
#
# Trigger: Push/PR to master + merge queue + daily schedule + manual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 1 * * *" # Daily at 1 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # google/osv-scanner-action image v2.5.1 (linux/amd64), resolved 2026-08-20.
  # Pin the runtime image itself: the upstream action metadata references a
  # mutable version tag even when the action is pinned to a commit SHA.
  OSV_SCANNER_IMAGE: "ghcr.io/google/osv-scanner-action@sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc"

jobs:
  changes:
    name: Classify security changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dependency: ${{ steps.route.outcome == 'success' && steps.route.outputs.dependency || 'true' }}
      codeql: ${{ steps.route.outcome == 'success' && steps.route.outputs.codeql || 'true' }}
      semgrep: ${{ steps.route.outcome == 'success' && steps.route.outputs.semgrep || 'true' }}
      semgrep_full: ${{ steps.route.outcome == 'success' && steps.route.outputs.semgrep_full || 'true' }}
      security_tools: ${{ steps.route.outcome == 'success' && steps.route.outputs.security_tools || 'true' }}
    steps:
      - name: 📥 Checkout routing inputs
        id: routing_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 🧭 Classify changed paths
        id: classify
        if: ${{ steps.routing_checkout.outcome == 'success' }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-workflow-changes.sh
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-workflow-changes.sh"
              [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              git show "$TRUSTED_BASE_SHA:scripts/ci/classify-workflow-changes.sh" > "$classifier"
              ;;
          esac
          bash "$classifier"

      - name: 🛡️ Resolve fail-open routing
        id: route
        if: ${{ always() }}
        continue-on-error: true
        env:
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          DEPENDENCY: ${{ steps.classify.outputs.dependency }}
          CODEQL: ${{ steps.classify.outputs.codeql }}
          SEMGREP: ${{ steps.classify.outputs.semgrep }}
          SEMGREP_FULL: ${{ steps.classify.outputs.semgrep_full }}
          SECURITY_TOOLS: ${{ steps.classify.outputs.security_tools }}
        run: |
          set -euo pipefail
          valid=true
          for value in "$DEPENDENCY" "$CODEQL" "$SEMGREP" "$SEMGREP_FULL" "$SECURITY_TOOLS"; do
            if [[ ! "$value" =~ ^(true|false)$ ]]; then
              valid=false
            fi
          done

          if [[ "$CLASSIFY_OUTCOME" != "success" || "$valid" != "true" ]]; then
            echo "Change routing failed; enabling every security gate."
            DEPENDENCY=true
            CODEQL=true
            SEMGREP=true
            SEMGREP_FULL=true
            SECURITY_TOOLS=true
          fi

          {
            echo "dependency=$DEPENDENCY"
            echo "codeql=$CODEQL"
            echo "semgrep=$SEMGREP"
            echo "semgrep_full=$SEMGREP_FULL"
            echo "security_tools=$SECURITY_TOOLS"
          } >> "$GITHUB_OUTPUT"

  pinned-tools:
    name: 🔄 Pinned tool freshness
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.security_tools == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check pinned tools after the cooling window
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-pinned-tools.sh

  osv-scan-pr:
    name: pr-gate/osv / osv-scan
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.outputs.dependency != 'true' }}
        run: echo "OSV dependency scanning is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: ⏪ Checkout the PR base
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git switch --force --detach "$BASE_SHA"
          git submodule update --init --recursive

      - name: 📁 Prepare isolated OSV result directory
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"

      - name: 🛡️ Scan dependencies before the PR
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        continue-on-error: true
        run: |
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/old-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: ⏩ Checkout the PR result
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Scan dependencies after the PR
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        continue-on-error: true
        run: |
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/new-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: 📋 Report newly introduced vulnerabilities
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --old=old-results.json \
            --new=new-results.json \
            --output-files=sarif:osv-results.sarif \
            '--output-files=gh-annotations:#stderr' \
            --fail-on-vuln=true

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ needs.changes.outputs.dependency == 'true' && !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-dispatch:
    name: pr-gate/osv / osv-scan
    needs: changes
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.outputs.dependency != 'true' }}
        run: echo "OSV dependency scanning is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🛡️ Run OSV scan
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/osv-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: 📋 Convert OSV results to SARIF and enforce the vulnerability gate
        if: ${{ needs.changes.outputs.dependency == 'true' }}
        run: |
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --output-files=sarif:osv-results.sarif \
            --new=osv-results.json \
            --fail-on-vuln=true

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ needs.changes.outputs.dependency == 'true' && !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: 🔎 CodeQL Analysis (${{ matrix.language }})
    needs: changes
    if: ${{ needs.changes.outputs.codeql == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 🔎 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: pr-gate/semgrep
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      contents: read
      security-events: write
    # semgrep/semgrep:1.174.0 — last checked: 2026-08-22
    # Check for updates: https://github.com/semgrep/semgrep/releases
    container:
      image: semgrep/semgrep:1.174.0@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade
    steps:
      - name: ⏭️ No Semgrep-relevant changes
        if: ${{ needs.changes.outputs.semgrep != 'true' }}
        run: echo "Semgrep is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.semgrep == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔍 Run Semgrep scan
        if: ${{ needs.changes.outputs.semgrep_full == 'true' }}
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: 🔐 Scan documentation for secrets
        if: ${{ needs.changes.outputs.semgrep == 'true' && needs.changes.outputs.semgrep_full != 'true' }}
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: 📊 Upload SARIF to GitHub Security
        if: ${{ needs.changes.outputs.semgrep == 'true' && !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif

  report-pr-gate-statuses:
    name: Report PR gate statuses
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [osv-scan-dispatch, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish required commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          OSV_RESULT: ${{ needs.osv-scan-dispatch.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          set -euo pipefail

          publish_status() {
            local context="$1"
            local result="$2"
            local state=success
            if [[ "$result" != "success" ]]; then
              state=failure
            fi

            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f "state=$state" \
              -f "context=$context" \
              -f "description=workflow_dispatch result: $result" \
              -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          publish_status "pr-gate/osv / osv-scan" "$OSV_RESULT"
          publish_status "pr-gate/semgrep" "$SEMGREP_RESULT"

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs:
      [changes, pinned-tools, osv-scan-pr, osv-scan-dispatch, codeql, semgrep, report-pr-gate-statuses]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize and validate event-specific scans
        env:
          EVENT_NAME: ${{ github.event_name }}
          PINNED_TOOLS_RESULT: ${{ needs.pinned-tools.result }}
          OSV_PR_RESULT: ${{ needs.osv-scan-pr.result }}
          OSV_FULL_RESULT: ${{ needs.osv-scan-dispatch.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          STATUS_REPORT_RESULT: ${{ needs.report-pr-gate-statuses.result }}
          CODEQL_REQUIRED: ${{ needs.changes.outputs.codeql }}
          PINNED_TOOLS_REQUIRED: ${{ needs.changes.outputs.security_tools }}
        run: |
          set -euo pipefail

          {
            echo "## Security scan results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Pinned tool freshness | $PINNED_TOOLS_RESULT |"
            echo "| OSV PR diff | $OSV_PR_RESULT |"
            echo "| OSV full | $OSV_FULL_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| Semgrep | $SEMGREP_RESULT |"
            echo "| Manual status report | $STATUS_REPORT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          expect_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "Expected $label to succeed for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_when_required() {
            local required="$1"
            local label="$2"
            local result="$3"
            if [[ "$required" == "true" ]]; then
              expect_success "$label" "$result"
            elif [[ "$result" != "skipped" ]]; then
              echo "Expected irrelevant $label to skip for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_when_required "$CODEQL_REQUIRED" "CodeQL" "$CODEQL_RESULT"
          expect_success "Semgrep" "$SEMGREP_RESULT"
          case "$EVENT_NAME" in
            pull_request)
              expect_success "OSV PR diff" "$OSV_PR_RESULT"
              ;;
            merge_group)
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            push|schedule)
              expect_when_required "$PINNED_TOOLS_REQUIRED" "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            workflow_dispatch)
              expect_success "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              expect_success "manual status report" "$STATUS_REPORT_RESULT"
              ;;
            *)
              echo "Unsupported security workflow event: $EVENT_NAME" >&2
              failed=1
              ;;
          esac

          exit "$failed"
