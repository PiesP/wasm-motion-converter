name: 🌐 Production verification

on:
  workflow_run:
    workflows: ["🏗️ CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-verification
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  public:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          submodules: true

      - uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc

      - name: Read the exact successful source build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ github.event.workflow_run.head_sha }}
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare bounded owned media and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          vp run prepare:e2e:fixture
          vp exec playwright install --with-deps chromium

      - name: Match and verify actual production
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFY_CURRENT_MASTER: '1'
        run: vp run verify:deploy

      - name: Preserve public verification evidence
        if: ${{ steps.node_trust.outcome == 'success' && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-verification-${{ github.event.workflow_run.head_sha }}
          path: |
            deployment-verification.json
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
