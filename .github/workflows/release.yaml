name: 🚀 Release

# Responsibility: validate and publish tagged web app releases.
#
# Validation runs independently. The publish job has the only write
# permissions and starts only after every validation job succeeds.
#
# Trigger: Manual dispatch from protected master for an existing v* tag.

# Security: All third-party actions pinned to full commit SHAs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) contained in protected master
        required: true
        type: string

permissions:
  contents: read

jobs:
  provenance:
    name: 🔐 Verify protected release source
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-sha: ${{ steps.verify.outputs.release-sha }}
      version: ${{ steps.verify.outputs.version }}
      node-version: ${{ steps.verify.outputs.node-version }}
    steps:
      - name: 📥 Checkout protected workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: 📦 Setup trusted provenance runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔐 Verify tag belongs to protected master
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node --experimental-strip-types scripts/release/verify-source.ts

  quality:
    name: ✅ Release quality
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: ✅ Run quality gate
        run: pnpm quality

  unit:
    name: 🧪 Release unit + coverage
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🧪 Run unit tests and coverage thresholds
        run: pnpm test:cov

  e2e:
    name: 🎭 Release E2E
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🎞️ Install fixture encoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: 🎭 Run E2E tests
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:e2e:ci

  duplication:
    name: 🔍 Release duplication
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          persist-credentials: false

      - name: 📦 Setup protected pin runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 🔧 Install nose
        run: |
          set -euo pipefail
          trusted_sha=7a5ab41114bfe234b4524303680f792266b551d3
          git cat-file -e "$trusted_sha^{commit}"
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          for name in pinned-tools.json pinned-tools.ts check-pinned-tools.ts install-nose.ts; do
            git show "$trusted_sha:scripts/ci/$name" > "$pinned_dir/$name"
            chmod 0600 "$pinned_dir/$name"
          done
          node --experimental-strip-types "$pinned_dir/install-nose.ts"

      - name: 🔎 Check for new duplication
        run: nose query src --baseline .nose-baseline.json --fail-on new

  mutation:
    name: 🧬 Release mutation
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🧬 Run mutation gate
        run: pnpm mut:fast

  build:
    name: 🏗️ Build release package
    needs: [provenance, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🏗️ Build app
        run: pnpm build:ci

      - name: 📦 Prepare release bundle
        env:
          RELEASE_VERSION: ${{ needs.provenance.outputs.version }}
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: pnpm release:prepare

      - name: 📊 Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ needs.provenance.outputs.release-sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  publish:
    name: 🏷️ Publish GitHub Release
    needs: [provenance, quality, unit, e2e, duplication, mutation, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout protected publication guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 📥 Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle-${{ needs.provenance.outputs.release-sha }}
          path: release-bundle

      - name: 📦 Setup verified Node.js runtime
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: .
          runtime: "node@${{ needs.provenance.outputs.node-version }}"
          install: false

      - name: 🔐 Check live publication order
        id: publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.provenance.outputs.version }}
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: node --experimental-strip-types scripts/release/publication-guard.ts

      - name: 📤 Publish to release branch
        if: ${{ steps.publication.outputs.publish-branch == 'true' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: release-bundle/dist
          force_orphan: true

      - name: 🏷️ Create GitHub Release
        if: ${{ steps.publication.outputs.create-release == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release-bundle/RELEASE_NOTES.md
          files: |
            release-bundle/release/*
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
