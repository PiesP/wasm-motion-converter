name: 🏗️ CI

# Responsibility: fast, independent verification for pull requests and merge queue
# - Run static quality checks
# - Run unit tests with coverage thresholds
# - Run browser E2E tests
# - Build the production app
#
# Triggered on: Push/PR to master + merge queue

# Security: All third-party actions pinned to full commit SHAs.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  changes:
    name: Classify workflow changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.route.outcome == 'success' && steps.route.outputs.quality || 'true' }}
      unit: ${{ steps.route.outcome == 'success' && steps.route.outputs.unit || 'true' }}
      e2e: ${{ steps.route.outcome == 'success' && steps.route.outputs.e2e || 'true' }}
      build: ${{ steps.route.outcome == 'success' && steps.route.outputs.build || 'true' }}
    steps:
      - uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: 📥 Checkout routing inputs
        id: routing_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 📦 Setup routing Node without dependencies
        id: routing_runtime
        if: ${{ steps.routing_checkout.outcome == 'success' }}
        continue-on-error: true
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: 🧭 Classify changed paths
        id: classify
        if: ${{ steps.routing_checkout.outcome == 'success' && steps.routing_runtime.outcome == 'success' }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-workflow-changes.ts
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-workflow-changes.ts"
              [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              # The first migration PR has no TypeScript file in its trusted base;
              # extraction then fails and the routing step enables every gate.
              git show "$TRUSTED_BASE_SHA:scripts/ci/classify-workflow-changes.ts" > "$classifier"
              ;;
          esac
          node --experimental-strip-types "$classifier"

      - name: 🛡️ Resolve fail-open routing
        id: route
        if: ${{ always() }}
        continue-on-error: true
        env:
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          QUALITY: ${{ steps.classify.outputs.quality }}
          UNIT: ${{ steps.classify.outputs.unit }}
          E2E: ${{ steps.classify.outputs.e2e }}
          BUILD: ${{ steps.classify.outputs.build }}
        run: |
          set -euo pipefail
          valid=true
          for value in "$QUALITY" "$UNIT" "$E2E" "$BUILD"; do
            if [[ ! "$value" =~ ^(true|false)$ ]]; then
              valid=false
            fi
          done

          if [[ "$CLASSIFY_OUTCOME" != "success" || "$valid" != "true" ]]; then
            echo "Change routing failed; enabling every CI gate."
            QUALITY=true
            UNIT=true
            E2E=true
            BUILD=true
          fi

          {
            echo "quality=$QUALITY"
            echo "unit=$UNIT"
            echo "e2e=$E2E"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: pr-gate/quality
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: ⏭️ No quality-relevant changes
        if: ${{ needs.changes.outputs.quality != 'true' }}
        run: echo "Quality gate is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.quality == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.outputs.quality == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc

      - name: ✅ Run quality gate
        if: ${{ needs.changes.outputs.quality == 'true' }}
        run: vp run quality

  unit:
    name: pr-gate/unit
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: ⏭️ No unit-relevant changes
        if: ${{ needs.changes.outputs.unit != 'true' }}
        run: echo "Unit tests are not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.unit == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.outputs.unit == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc

      - name: Record release setup inputs
        if: ${{ needs.changes.outputs.unit == 'true' }}
        run: sha256sum .node-version package.json pnpm-lock.yaml pnpm-workspace.yaml > "$RUNNER_TEMP/release-setup-inputs.sha256"

      - name: Verify selected Vite+ release setup
        if: ${{ needs.changes.outputs.unit == 'true' }}
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/release-setup-inputs.sha256"
          expected_node="$(cat .node-version)"
          expected_pnpm="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          test "$(node --version)" = "v$expected_node"
          test "$(vp env current --json | node -e "let s='';process.stdin.on('data', x=>s+=x).on('end',()=>console.log(JSON.parse(s).package_manager.version))")" = "$expected_pnpm"

      # quality owns test:ci when selected; unit retains it for unit-only routing.
      - name: 🧪 Run policy tests when quality is unaffected
        if: ${{ needs.changes.outputs.unit == 'true' }}
        env:
          QUALITY_SELECTED: ${{ needs.changes.outputs.quality }}
        run: |
          if [[ "$QUALITY_SELECTED" != "true" ]]; then
            vp run test:ci
          else
            echo "Policy tests are owned by the selected quality gate."
          fi

      - name: 🎭 Install Chromium for Browser Mode coverage
        if: ${{ needs.changes.outputs.unit == 'true' }}
        run: vp exec playwright install --with-deps chromium

      - name: 🧪 Run unit coverage thresholds
        if: ${{ needs.changes.outputs.unit == 'true' }}
        run: vp run test:cov

  e2e:
    name: pr-gate/e2e
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: ⏭️ No E2E-relevant changes
        if: ${{ needs.changes.outputs.e2e != 'true' }}
        run: echo "Browser E2E is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc

      - name: 🎭 Resolve installed Playwright version
        id: playwright
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"

      - name: 🎭 Cache Playwright browsers
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-chromium-firefox-webkit-${{ steps.playwright.outputs.version }}

      - name: 🎞️ Install fixture encoder
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: 🎭 Run repository-backed E2E tests
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        run: |
          vp exec playwright install --with-deps chromium firefox webkit
          vp run test:e2e:ci

      - name: 📊 Upload Playwright diagnostics
        if: ${{ steps.node_trust.outcome == 'success' && (needs.changes.outputs.e2e == 'true' && failure() && !cancelled()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: pr-gate/build
    needs: [changes, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: ⏭️ No build-relevant changes
        if: ${{ needs.changes.outputs.build != 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        run: echo "Production build is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.build == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.outputs.build == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc

      - name: 🏗️ Build app
        if: ${{ needs.changes.outputs.build == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        run: vp run build:ci

      - name: 📊 Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          name: build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
