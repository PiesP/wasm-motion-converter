name: 🏗️ CI

# Responsibility: fast, independent verification for pull requests and merge queue
# - Run static quality checks
# - Run unit tests with coverage thresholds
# - Run browser E2E tests
# - Build the production app
# - Report the required duplication status; strict duplication runs in Deep Verification
#
# Expensive mutation testing lives in deep-checks.yaml so PR feedback is not
# blocked by a long-running, resource-heavy analysis.
#
# Triggered on: Push/PR to master + merge queue

# Security: All third-party actions pinned to full commit SHAs.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify workflow changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.route.outcome == 'success' && steps.route.outputs.quality || 'true' }}
      unit: ${{ steps.route.outcome == 'success' && steps.route.outputs.unit || 'true' }}
      e2e: ${{ steps.route.outcome == 'success' && steps.route.outputs.e2e || 'true' }}
      build: ${{ steps.route.outcome == 'success' && steps.route.outputs.build || 'true' }}
      duplication: ${{ steps.route.outcome == 'success' && steps.route.outputs.duplication || 'true' }}
    steps:
      - name: 📥 Checkout routing inputs
        id: routing_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 📦 Setup routing Node without dependencies
        id: routing_runtime
        if: ${{ steps.routing_checkout.outcome == 'success' }}
        continue-on-error: true
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🧭 Classify changed paths
        id: classify
        if: ${{ steps.routing_checkout.outcome == 'success' && steps.routing_runtime.outcome == 'success' }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-workflow-changes.ts
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-workflow-changes.ts"
              [[ "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              # The first migration PR has no TypeScript file in its trusted base;
              # extraction then fails and the routing step enables every gate.
              git show "$TRUSTED_BASE_SHA:scripts/ci/classify-workflow-changes.ts" > "$classifier"
              ;;
          esac
          node --experimental-strip-types "$classifier"

      - name: 🛡️ Resolve fail-open routing
        id: route
        if: ${{ always() }}
        continue-on-error: true
        env:
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          QUALITY: ${{ steps.classify.outputs.quality }}
          UNIT: ${{ steps.classify.outputs.unit }}
          E2E: ${{ steps.classify.outputs.e2e }}
          BUILD: ${{ steps.classify.outputs.build }}
          DUPLICATION: ${{ steps.classify.outputs.duplication }}
        run: |
          set -euo pipefail
          valid=true
          for value in "$QUALITY" "$UNIT" "$E2E" "$BUILD" "$DUPLICATION"; do
            if [[ ! "$value" =~ ^(true|false)$ ]]; then
              valid=false
            fi
          done

          if [[ "$CLASSIFY_OUTCOME" != "success" || "$valid" != "true" ]]; then
            echo "Change routing failed; enabling every CI gate."
            QUALITY=true
            UNIT=true
            E2E=true
            BUILD=true
            DUPLICATION=true
          fi

          {
            echo "quality=$QUALITY"
            echo "unit=$UNIT"
            echo "e2e=$E2E"
            echo "build=$BUILD"
            echo "duplication=$DUPLICATION"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: pr-gate/quality
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No quality-relevant changes
        if: ${{ needs.changes.outputs.quality != 'true' }}
        run: echo "Quality gate is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.quality == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.outputs.quality == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      - name: ✅ Run quality gate
        if: ${{ needs.changes.outputs.quality == 'true' }}
        run: pnpm quality

  unit:
    name: pr-gate/unit
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No unit-relevant changes
        if: ${{ needs.changes.outputs.unit != 'true' }}
        run: echo "Unit tests are not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.unit == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.outputs.unit == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      - name: 🧪 Run unit tests and coverage thresholds
        if: ${{ needs.changes.outputs.unit == 'true' }}
        run: |
          pnpm test:ci
          pnpm test:cov

  e2e:
    name: pr-gate/e2e
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: ⏭️ No E2E-relevant changes
        if: ${{ needs.changes.outputs.e2e != 'true' }}
        run: echo "Browser E2E is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 🎭 Cache Playwright browsers
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 📦 Setup project
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      - name: 🎞️ Install fixture encoder
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: 🎭 Run repository-backed E2E tests
        if: ${{ needs.changes.outputs.e2e == 'true' }}
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:e2e:ci

      - name: 📊 Upload Playwright diagnostics
        if: ${{ needs.changes.outputs.e2e == 'true' && failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: pr-gate/build
    needs: [changes, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No build-relevant changes
        if: ${{ needs.changes.outputs.build != 'true' }}
        run: echo "Production build is not affected by this change set."

      - name: 📥 Checkout code
        if: ${{ needs.changes.outputs.build == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.outputs.build == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      - name: 🏗️ Build app
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: pnpm build:ci

      - name: 📊 Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.changes.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          name: build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
