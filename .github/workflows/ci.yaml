name: CI

# Continuous Integration for dropconvert-wasm
# - Lint (Biome)
# - Format check (Biome)
# - Typecheck (TypeScript)
# - Build (Vite)

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.txt"
      - "**/*.svg"
      - ".vscode/**"
      - ".github/*.md"
      - "LICENSES/**"
      - "public/LICENSES.md"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.txt"
      - "**/*.svg"
      - ".vscode/**"
      - ".github/*.md"
      - "LICENSES/**"
      - "public/LICENSES.md"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Quality checks
        run: |
          pnpm -s quality
          if ! git diff --quiet; then
            echo "::error::Code quality normalization changed files. Run 'pnpm quality' locally and commit the result."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi

      - name: Generate build metadata
        run: pnpm -s sri:generate && pnpm -s licenses:generate

      - name: Build
        run: pnpm exec vite build

      - name: Upload dist (push only)
        uses: actions/upload-artifact@v6
        if: github.event_name == 'push'
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
