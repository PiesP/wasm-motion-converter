---
# Dependabot configuration for wasm-motion-converter
# Stack: Vite + SolidJS + TypeScript + Tailwind + WebCodecs

version: 2
updates:
  # Root workspace npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
      # Cooldown: wait 7 days after a package is released before creating a PR.
      # This mitigates supply-chain attacks where malicious packages are typically
      # detected and removed within days of publication.
      cooldown:
        default: 7
        semver-patch: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "PiesP"

    # Auto-rebase to reduce merge conflicts
    rebase-strategy: "auto"

    # Restrict normal version updates to direct dependencies.
    allow:
      - dependency-type: "direct"


    # Group updates by category to reduce PR noise
    groups:
      solid:
        patterns:
          - "solid-js"
          - "vite-plugin-solid"
        update-types:
          - "minor"
          - "patch"

      build:
        patterns:
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"

      tailwind:
        patterns:
          - "tailwindcss"
          - "postcss"
        update-types:
          - "minor"
          - "patch"

      # TypeScript ecosystem
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Linting and formatting (Biome + Knip)
      quality:
        patterns:
          - "@biomejs/*"
        update-types:
          - "minor"
          - "patch"

      pnpm:
        patterns:
          - "pnpm"
        update-types:
          - "minor"
          - "patch"

    # Ignore packages that require manual review for major updates
    ignore:
      # Vite major updates need careful review
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # pnpm transitive bump jobs can fail with tool_feature_not_supported.
      # Minor/patch handled automatically; major requires manual review.
      - dependency-name: "@isaacs/brace-expansion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "minimatch"
        update-types: ["version-update:semver-major"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
      # Cooldown: wait 7 days after a package is released before creating a PR.
      # This mitigates supply-chain attacks where malicious packages are typically
      # detected and removed within days of publication.
      cooldown:
        default: 7
        semver-patch: 3
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "ci"
      - "dependencies"
      - "automated"
    reviewers:
      - "PiesP"
    groups:
      actions:
        patterns:
          - "*"
    # pnpm/action-setup@v6 has a known bug (pnpm/action-setup#225) that always
    # installs pnpm v11 beta, ignoring the packageManager field. Skip major
    # upgrades until the bug is resolved upstream.
    ignore:
      - dependency-name: "pnpm/action-setup"
        update-types: ["version-update:semver-major"]
