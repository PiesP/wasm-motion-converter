# Dependabot configuration for wasm-motion-converter
# Stack: Vite + SolidJS + TypeScript + Tailwind + WebCodecs

version: 2
updates:
  # Root workspace npm packages
  # Port mediabunny's version-specific memory-limit patch and lockfile together;
  # a version-only update fails closed with ERR_PNPM_UNUSED_PATCH.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Batch routine dependency review once per week; security alerts remain
    # visible through the normal advisory and scanner paths.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    reviewers:
      - "PiesP"
    labels:
      - "dependencies"
      - "automated"

    # Auto-rebase to reduce merge conflicts
    rebase-strategy: "auto"

    # Restrict normal version updates to direct dependencies.
    allow:
      - dependency-type: "direct"

    # Group updates by category to reduce PR noise
    groups:
      vite-plus:
        patterns:
          - "vite-plus"
        update-types:
          - "minor"
          - "patch"

      solid:
        patterns:
          - "solid-js"
          - "vite-plugin-solid"
        update-types:
          - "minor"
          - "patch"

      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"

      # TypeScript ecosystem
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      pnpm:
        patterns:
          - "pnpm"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Vite+ owns these component versions; keep its own update PR visible.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@vitest/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@voidzero-dev/vite-plus-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # These transitive-only major bumps are not supported by Dependabot's
      # lockfile update path. Direct major updates remain visible for review.
      - dependency-name: "@isaacs/brace-expansion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "minimatch"
        update-types: ["version-update:semver-major"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-release"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Batch routine Actions review once per week; urgent fixes can still be
    # requested manually or through security advisories.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    reviewers:
      - "PiesP"
    labels:
      - "ci"
      - "dependencies"
      - "automated"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      pnpm-setup:
        patterns:
          - "pnpm/action-setup"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
          - "pnpm/action-setup"
