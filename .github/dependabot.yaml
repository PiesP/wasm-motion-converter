# Dependabot configuration for wasm-motion-converter
# Stack: Vite + SolidJS + TypeScript + Tailwind + WebCodecs

version: 2
updates:
  # Root workspace npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Keep only a short supply-chain cooling window for this fast-moving project.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    reviewers:
      - "PiesP"
    labels:
      - "dependencies"
      - "automated"

    # Auto-rebase to reduce merge conflicts
    rebase-strategy: "auto"

    # Restrict normal version updates to direct dependencies.
    allow:
      - dependency-type: "direct"

    # Group updates by category to reduce PR noise
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

      stryker:
        patterns:
          - "@stryker-mutator/*"
        update-types:
          - "minor"
          - "patch"

      solid:
        patterns:
          - "solid-js"
          - "vite-plugin-solid"
        update-types:
          - "minor"
          - "patch"

      build:
        patterns:
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"

      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"

      # TypeScript ecosystem
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Linting and formatting (Biome + Knip)
      quality:
        patterns:
          - "@biomejs/*"
          - "knip"
        update-types:
          - "minor"
          - "patch"

      pnpm:
        patterns:
          - "pnpm"
        update-types:
          - "minor"
          - "patch"

    # These transitive-only major bumps are not supported by Dependabot's
    # lockfile update path. Direct major updates remain visible for review.
    ignore:
      - dependency-name: "@isaacs/brace-expansion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "minimatch"
        update-types: ["version-update:semver-major"]

  # Codex Security CLI and its integrity-locked npm closure
  - package-ecosystem: "npm"
    directory: "/scripts/security/codex-security"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps-security)"
    reviewers:
      - "PiesP"
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Keep only a short supply-chain cooling window for this fast-moving project.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    reviewers:
      - "PiesP"
    labels:
      - "ci"
      - "dependencies"
      - "automated"
    groups:
      actions:
        patterns:
          - "*"
