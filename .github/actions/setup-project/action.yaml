name: Setup project
description: Configure the pinned toolchain and install locked project dependencies

inputs:
  node-version:
    description: Node.js version passed to the pinned setup action
    required: true

runs:
  using: composite
  steps:
    - name: Setup pinned pnpm and Node.js
      uses: ./.github/actions/setup-toolchain
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
